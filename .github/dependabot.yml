version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # See docs/MAINTENANCE.md before raising the Python 3.9 floor.
    ignore:
      - dependency-name: "mypy"
        versions: [">=1.20.0"]
      - dependency-name: "coverage"
        versions: [">=7.11.0"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
