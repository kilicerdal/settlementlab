[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settlementlab"
version = "4.1.0"
readme = "README.md"
description = "A deterministic post-trade lifecycle simulator and assurance workbench"
requires-python = ">=3.9"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
settlementlab = "settlementlab.server:main"
settlementlab-worker = "settlementlab.worker:main"
settlementlab-backup = "settlementlab.infrastructure.backup:main"
settlementlab-review-ai = "settlementlab.assurance.ai_review:main"

settlementlab-assure = "settlementlab.assurance.runner:main"
settlementlab-evaluate-ai = "settlementlab.assurance.evaluation:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "playwright>=1.48,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
settlementlab = ["static/*.html", "static/*.css", "static/*.js"]
"settlementlab.assurance" = ["catalog/*.json", "datasets/*.json"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/settlementlab/core", "src/settlementlab/configuration.py", "src/settlementlab/assurance/catalogs.py", "src/settlementlab/assurance/transport.py", "src/settlementlab/assurance/targets.py", "src/settlementlab/assurance/http_steps.py", "src/settlementlab/assurance/reporting.py", "src/settlementlab/assurance/evaluation.py"]

[tool.coverage.run]
branch = true
source = ["settlementlab"]
data_file = "artifacts/coverage/.coverage"

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.coverage.html]
directory = "artifacts/coverage/html"

[tool.coverage.xml]
output = "artifacts/coverage/coverage.xml"

[tool.coverage.json]
output = "artifacts/coverage/coverage.json"
