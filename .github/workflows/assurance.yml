name: Settlement assurance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . -r requirements-quality.txt
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - run: mypy
      - run: python -c "from importlib.resources import files; assert files('settlementlab').joinpath('static/index.html').is_file()"
      - run: settlementlab --help
      - run: settlementlab-evaluate-ai --report-dir artifacts/ai-evaluation
      - run: coverage run -m settlementlab.assurance.runner --suite all --root . --report-dir artifacts/reports
      - run: coverage report
      - run: coverage json
      - run: coverage xml
      - run: coverage html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assurance-python-${{ matrix.python }}
          path: |
            artifacts/reports/
            artifacts/coverage/
            artifacts/ai-evaluation/
  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install 'playwright>=1.48,<2'
      - run: python -m playwright install --with-deps chromium
      - run: |
          PYTHONPATH=src python -m settlementlab.server --business-date 2026-11-09 > /tmp/settlementlab.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/api/health')
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Server failed readiness check')
          PY
          python tests/browser_smoke.py
          PYTHONPATH=src python tests/browser/durable_smoke.py
      - run: PYTHONPATH=src python tests/browser/lifecycle_smoke.py
      - run: PYTHONPATH=src python tests/browser/investigation_smoke.py
      - run: PYTHONPATH=src python tests/browser/consistency_smoke.py
      - run: python -m scripts.rehearse_fresh_checkout --output artifacts/fresh-checkout
      - run: PYTHONPATH=src python -m scripts.record_v44 --output artifacts/v44-walkthrough
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: artifacts/

  reuse:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install .
      - run: |
          python -m examples.collateral_service.server --port 8090 --db /tmp/collateral-control.db > /tmp/collateral-control.log 2>&1 &
          python -m examples.collateral_service.server --port 8091 --db /tmp/collateral-fault.db --fault-duplicate-replay > /tmp/collateral-fault.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for port in (8090,8091):
              for _ in range(50):
                  try:
                      urllib.request.urlopen('http://127.0.0.1:'+str(port)+'/health')
                      break
                  except OSError:
                      time.sleep(0.1)
              else:
                  raise SystemExit('Independent service failed readiness')
          PY
          settlementlab-assure --suite scenarios --target-profile targets/collateral.json --report-dir artifacts/reuse-control
          settlementlab-assure --suite scenarios --target owned-api --base-url http://127.0.0.1:8090 --scenario-dir examples/scenario_packs/inventory --report-dir artifacts/reuse-custom-pack
          if settlementlab-assure --suite scenarios --target collateral --base-url http://127.0.0.1:8091 --report-dir artifacts/reuse-fault; then
            echo "Injected defect was not rejected"
            exit 1
          fi
          python - <<'PY'
          import json
          report=json.load(open('artifacts/reuse-fault/results.json'))
          assert report['status']=='failed'
          cases={case['id']:case for case in report['cases']}
          assert cases['C01']['status']=='passed'
          assert cases['C02']['steps'][-1]['failure']=={'kind':'http_status','expected':200,'actual':201}
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: independent-target-evidence
          path: artifacts/reuse-*/

  showcase:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install .
      - run: python -m scripts.showcase
      - run: python -m scripts.showcase --verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: portable-showcase
          path: artifacts/showcase/

  durable:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install .
      - run: settlementlab-worker --help
      - run: python -m scripts.durable_showcase
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: durable-recovery-evidence
          path: artifacts/durable-showcase/

  reviewer-ready:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install . -r requirements-quality.txt
      - run: python -m scripts.reviewer_ready --quality
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v41-engineering-scorecard
          path: artifacts/reviewer-ready/

  lifecycle-v42:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install . 'setuptools>=68' wheel
      - run: python -m scripts.mutation_campaign
      - run: python -m scripts.v42_compatibility
      - run: python -m scripts.v42_workload --trades 1000
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: python -m scripts.verify_workbench_package --wheel dist/settlementlab-4.4.1-py3-none-any.whl
      - run: python -m scripts.build_assurance
      - run: python -m scripts.verify_assurance_package
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v42-lifecycle-and-framework-evidence
          path: |
            artifacts/v42/
            artifacts/v441/
            dist/settlementlab-*.whl
            dist/settlementlab_assurance-*.whl

  investigation-v43:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install .
      - run: settlementlab-incident --exercise --output artifacts/v43-incident
      - run: settlementlab-incident --verify artifacts/v43-incident/resolved.zip
      - run: settlementlab-evaluate-investigator --output artifacts/v43-ai
      - run: python -m scripts.v42_compatibility --source-release v4.2.0 --output artifacts/v43-compatibility
      - run: python scripts/incident_quickstart.py --no-serve --output artifacts/v43-fresh-checkout
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v43-incident-and-investigator-evidence
          path: |
            artifacts/v43-incident/
            artifacts/v43-ai/
            artifacts/v43-compatibility/
            artifacts/v43-fresh-checkout/

  consistency-v44:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install .
      - run: settlementlab-incident --output artifacts/v44-incident
      - run: settlementlab-incident --verify artifacts/v44-incident/resolved.zip --expectations artifacts/v44-incident/accepted-plan.json
      - run: settlementlab-position-worker --help
      - run: python -m scripts.investigation_benchmark --statements 1000 --output artifacts/v44-investigation
      - run: settlementlab-evaluate-investigator --output artifacts/v44-ai
      - run: python -m scripts.v42_compatibility --source-release v4.3.0 --output artifacts/v44-compatibility
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v44-consistency-and-economic-verification
          path: |
            artifacts/v44-incident/
            artifacts/v44-investigation/
            artifacts/v44-ai/
            artifacts/v44-compatibility/
