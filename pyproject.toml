[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settlementlab"
version = "2.4.0"
readme = "README.md"
description = "A deterministic post-trade lifecycle simulator and assurance workbench"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
settlementlab = "settlementlab.server:main"

settlementlab-assure = "settlementlab.assurance.runner:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "playwright>=1.48,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
settlementlab = ["static/*.html", "static/*.css", "static/*.js"]
"settlementlab.assurance" = ["catalog/*.json"]
